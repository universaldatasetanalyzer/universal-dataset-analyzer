services:
  - type: web
    name: uda-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PAGE_USER
        sync: false
      - key: ADMIN_PAGE_PASS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: PYTHON_SERVICE_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 52428800
      - key: MAX_DATASET_ROWS
        value: 1000000
      - key: MAX_DATASET_COLUMNS
        value: 200
      - key: MAX_STORAGE_BYTES
        value: 5368709120
      - key: MAX_CONCURRENT_ANALYSES
        value: 2
      - key: SENTRY_DSN
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: sandbox
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_URL
        sync: false
      - key: PADDLE_NOTIFICATION_SIGNING_SECRET
        sync: false
      - key: PADDLE_PRICE_MONTHLY
        sync: false
      - key: PADDLE_PRICE_YEARLY
        sync: false

  - type: web
    name: uda-python-service
    runtime: python
    rootDir: backend/python-service
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_SERVICE_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_DATASET_ROWS
        value: 1000000
      - key: MAX_DATASET_COLUMNS
        value: 200
